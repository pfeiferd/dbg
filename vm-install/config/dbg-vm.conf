# ---------------------------------------------------------------------------
# Zentrale Konfiguration der DBG-Website-VM
#
# Dies ist die EINZIGE Datei, die vor der Installation angepasst werden muss.
# Alle Skripte unter scripts/ und alle Vorlagen unter files/ lesen ihre Werte
# ausschliesslich hier heraus.
#
# Die Datei wird von install.sh als Shell-Fragment eingelesen - also keine
# Leerzeichen um das "=", Werte in Anfuehrungszeichen.
# ---------------------------------------------------------------------------


# === Website ===============================================================

# Hauptname der Site. Kommt in das Zertifikat, in ServerName und in die
# Weiterleitung von http auf https.
SITE_NAME="www.borreliose-gesellschaft.de"

# Weitere Namen, die auf dieselbe Site zeigen (durch Leerzeichen getrennt,
# leer lassen wenn es keine gibt). Werden als ServerAlias eingetragen und
# mit in das Zertifikat aufgenommen.
SITE_ALIASES="borreliose-gesellschaft.de"

# E-Mail-Adresse des Betreibers: ServerAdmin in Apache und Kontaktadresse
# bei Let's Encrypt (dorthin gehen Warnungen vor ablaufenden Zertifikaten).
ADMIN_EMAIL="daniel.pfeifer@hs-heilbronn.de"

# Verzeichnis, in dem der generierte Site-Inhalt liegt (DocumentRoot).
# Dorthin kopiert deploy-site.sh den Inhalt von target/website/.
DOC_ROOT="/var/www/dbg"


# === TLS / Zertifikat ======================================================

# letsencrypt  echtes Zertifikat von Let's Encrypt  (DNS muss schon auf
#              diese VM zeigen, Port 80 muss von aussen erreichbar sein)
# staging      wie letsencrypt, aber gegen die Testumgebung - das Zertifikat
#              ist im Browser ungueltig, dafuer gibt es keine Rate Limits.
#              Gut fuer einen Probelauf.
# selfsigned   selbst ausgestelltes Zertifikat. Fuer den Fall, dass der
#              DNS-Eintrag noch nicht umgestellt ist: die Site laeuft dann
#              schon komplett, der Browser warnt nur. Spaeter umstellen mit
#                  TLS_MODE=letsencrypt ./install.sh --only tls,site
TLS_MODE="selfsigned"

# Dauer der HSTS-Zusage in Sekunden (63072000 = 2 Jahre).
# ACHTUNG: HSTS wirkt nur mit einem gueltigen Zertifikat und ist fuer die
# angegebene Dauer nicht zurueckzunehmen. Bei TLS_MODE != letsencrypt wird
# der Header deshalb automatisch NICHT gesetzt.
HSTS_MAX_AGE="63072000"

# "yes" fuegt "preload" hinzu. Nur setzen, wenn die Domain wirklich dauerhaft
# ausschliesslich per https erreichbar sein soll (siehe hstspreload.org).
HSTS_PRELOAD="no"


# === SSH ===================================================================

# Port des SSH-Daemons. Ein Port abseits der 22 haelt das Protokoll der
# Zugriffsversuche kurz. 22 ist auch in Ordnung - fail2ban faengt den Rest.
#
# WICHTIG: Vor dem Umstellen sicherstellen, dass ein funktionierender
# Schluessel in ~/.ssh/authorized_keys liegt, und die laufende SSH-Sitzung
# offen halten, bis der neue Port getestet ist.
SSH_PORT="22"

# yes            Login als root per Passwort und Schluessel erlaubt
# prohibit-password  root nur per Schluessel (empfohlen)
# no             kein root-Login
SSH_PERMIT_ROOT_LOGIN="prohibit-password"

# auto  Passwort-Anmeldung nur dann abschalten, wenn mindestens ein
#       SSH-Schluessel hinterlegt ist (sonst Warnung, Passwort bleibt an)
# yes   in jedem Fall abschalten
# no    Passwort-Anmeldung unveraendert lassen
SSH_DISABLE_PASSWORD_AUTH="auto"

# Auf diese Benutzer den SSH-Zugang beschraenken (Leerzeichen-getrennt).
# Leer = keine Beschraenkung.
SSH_ALLOW_USERS=""


# === Firewall ==============================================================

# Zusaetzlich zu oeffnende Ports, Format wie bei ufw, Leerzeichen-getrennt.
# Haeufigster Fall: beim Umstellen des SSH-Ports die 22 noch offen halten,
# bis der neue Port getestet ist  ->  FIREWALL_EXTRA_ALLOW="22/tcp"
FIREWALL_EXTRA_ALLOW="22/tcp"

# IPv6 in ufw beruecksichtigen.
FIREWALL_IPV6="yes"


# === fail2ban ==============================================================

FAIL2BAN_BANTIME="1h"
FAIL2BAN_FINDTIME="10m"
FAIL2BAN_MAXRETRY="5"

# Eigene Adressen, die nie gesperrt werden (z.B. das Buero-Netz).
# 127.0.0.1/8 und ::1 sind immer dabei.
FAIL2BAN_IGNOREIP=""


# === System ================================================================

TIMEZONE="Europe/Berlin"
SYSTEM_LOCALE="de_DE.UTF-8"

# Automatische Sicherheitsaktualisierungen einschalten.
ENABLE_UNATTENDED_UPGRADES="yes"

# Beim Installieren alle vorhandenen Pakete aktualisieren (dist-upgrade).
# Bei einer frisch aufgesetzten VM sinnvoll, dauert aber etwas.
RUN_FULL_UPGRADE="yes"


# === Content Security Policy ===============================================

# Die generierte Site laedt alle Skripte, Stile und Schriften lokal. Nur die
# Kartenkacheln der Aerzteliste kommen von aussen - deshalb duerfen diese
# Hosts Bilder liefern. Weitere externe Quellen hier ergaenzen.
#
# ACHTUNG: Was hier steht, muss zur Datenschutzerklaerung passen. Der Abschnitt
# "Kartenanzeige in der Aerzte- und Therapeutenliste" in
# content/de/datenschutz.md (und content/en/privacy.md) benennt OpenStreetMap
# als einzigen Dritten, an den eine IP-Adresse geht. Kommt hier ein Host dazu,
# gehoert er auch dort hinein.
ENABLE_CSP="yes"
CSP_IMG_HOSTS="https://tile.openstreetmap.org https://tile.openstreetmap.de"


# === Vorschau (Zweig "staging") ============================================
#
# Ein Build auf dem Zweig "staging" landet nicht auf der oeffentlichen Site,
# sondern unter https://<SITE_NAME>/staging/ . Gleicher Server, gleiches
# Zertifikat, gleiche Kopfzeilen - die Vorschau verhaelt sich also genau wie
# das Original, und was dort abgenommen wird, geht unveraendert live.
#
# WICHTIG: Das Verzeichnis liegt NICHT unter DOC_ROOT, sondern daneben, und
# wird per Alias eingehaengt. Laege es darunter, wuerde die naechste
# Auslieferung der oeffentlichen Site es mit abraeumen ("rsync --delete").

ENABLE_STAGING="yes"

# Pfad in der Adresse. Ohne Schraegstrich am Ende.
STAGING_URL_PATH="/staging"

# Verzeichnis auf der Platte. Bewusst neben DOC_ROOT, nicht darunter.
STAGING_DOC_ROOT="/var/www/dbg-staging"

# Die Vorschau ist offen erreichbar - wer die Adresse kennt, sieht sie. Gegen
# Suchmaschinen schuetzt der Kopf "X-Robots-Tag: noindex" (siehe
# files/etc/apache2/conf-available/dbg-staging.conf). Der Pfad steht deshalb
# bewusst NICHT in einer robots.txt: die ist oeffentlich lesbar und wuerde ihn
# gerade verraten.
#
# Soll die Vorschau doch hinter eine Anmeldung: hier "benutzer:passwort" je
# Zeile eintragen, dann wird eine htpasswd-Datei angelegt und der Pfad
# geschuetzt. Leer = offen.
#
#   STAGING_BASIC_AUTH_USERS="vorstand:geheim1
#   redaktion:geheim2"
STAGING_BASIC_AUTH_USERS=""


# === Auslieferung aus GitHub Actions =======================================
#
# Die Site wird auf GitHub gebaut. Ein Build auf dem Zweig "main" schiebt das
# Ergebnis anschliessend hierher; "staging" geht nur auf GitHub Pages.
#
# Der Weg dorthin: ein eigener Benutzer mit eigenem SSH-Schluessel, dessen
# authorized_keys einen ERZWUNGENEN BEFEHL enthaelt. Dieser Schluessel kann
# damit ausschliesslich ein Site-Archiv abliefern - keine Shell, kein
# Dateizugriff. Es braucht deshalb KEINEN zusaetzlichen Port, kein Passwort
# und kein FTP: es laeuft ueber den SSH-Port, der ohnehin offen ist.
#
# Der private Schluessel liegt als Secret bei GitHub, nicht auf der VM.
# Welche Werte dort einzutragen sind, zeigt:  sudo ./show-deploy-secrets.sh

ENABLE_GITHUB_DEPLOY="yes"

# Benutzer, unter dem die Auslieferung ankommt. Ein Systemkonto ohne Passwort.
DEPLOY_USER="dbg-deploy"

# Oeffentlicher Schluessel, der ausliefern darf - eine Zeile, Format wie in
# authorized_keys ("ssh-ed25519 AAAA... kommentar").
#
# Leer lassen: dann erzeugt der Schritt "deploy" selbst ein Schluesselpaar und
# legt den privaten Teil nach /root/dbg-deploy-github ab, von wo er in das
# GitHub-Secret VM_SSH_KEY zu kopieren (und danach zu loeschen) ist.
#
# Besser, wenn der private Schluessel die VM nie berueren soll: auf dem eigenen
# Rechner  ssh-keygen -t ed25519 -C github-actions -f dbg-deploy  aufrufen, den
# Inhalt von dbg-deploy.pub hier eintragen und dbg-deploy (ohne .pub) als
# Secret bei GitHub hinterlegen.
DEPLOY_SSH_PUBKEY=""
