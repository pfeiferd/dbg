# ---------------------------------------------------------------------------
# https (Port 443) - hier liegt die eigentliche Site
# Abgelegt als /etc/apache2/sites-available/dbg-ssl.conf
#
# Einstiegspunkt ist die index.html der generierten Site: sie stellt die
# Sprache fest und leitet auf de/index.html bzw. en/index.html weiter.
# ---------------------------------------------------------------------------

<VirtualHost *:443>
        ServerName <site_name>
        <server_alias>

        ServerAdmin <admin_email>

        DocumentRoot <doc_root>

        # http/2 vor http/1.1 anbieten. Braucht mpm_event (Standard auf
        # Ubuntu) - 50-apache.sh stellt das sicher.
        Protocols h2 http/1.1

        # --- Zertifikat ---------------------------------------------------
        # Die uebrigen TLS-Einstellungen stehen global in
        # /etc/apache2/conf-available/dbg-ssl-params.conf.
        SSLEngine on
        SSLCertificateFile    <ssl_certificate_file>
        SSLCertificateKeyFile <ssl_certificate_key_file>
        <ssl_stapling>

        # --- Inhalt --------------------------------------------------------
        <Directory <doc_root>>
                # FollowSymLinks waere nur noetig, wenn im Site-Verzeichnis
                # Verweise liegen - tun sie nicht.
                Options -Indexes -Includes -ExecCGI -FollowSymLinks
                AllowOverride None
                Require all granted
        </Directory>

        # Einstieg: die Sprachweiche der generierten Site.
        DirectoryIndex index.html

        # Die Suchseite und die Kartendaten sind json; ohne diese Zuordnung
        # liefert Apache sie je nach Version als text/plain aus.
        <IfModule mod_mime.c>
                AddType application/json .json
                AddType image/svg+xml   .svg
                AddType font/woff2      .woff2
                AddDefaultCharset UTF-8
        </IfModule>

        # --- Protokolle ----------------------------------------------------
        # Format und Kuerzung der IP-Adresse: siehe
        # /etc/apache2/conf-available/dbg-logging.conf

        ErrorLog ${APACHE_LOG_DIR}/error.log
        LogLevel warn

        # Vollstaendiges Protokoll - kurze Frist, nur fuer Betrieb und
        # Angriffsabwehr.
        CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined

        # Gekuerztes Protokoll - lange Frist, fuer die Zugriffsstatistik.
        # Bewusst in einem EIGENEN Verzeichnis: die mitgelieferte
        # logrotate-Regel von Ubuntu erfasst /var/log/apache2/*.log pauschal
        # und wuerde diese Datei sonst nach derselben kurzen Frist
        # wegrotieren.
        #
        # Ohne die Aufrufe der Vorschau - siehe dbg-logging.conf.
        CustomLog /var/log/apache2-stats/access-anon.log anonymisiert env=!dont_log_stats
</VirtualHost>
