# ---------------------------------------------------------------------------
# http (Port 80) - leitet auf https weiter
# Abgelegt als /etc/apache2/sites-available/dbg-http.conf
#
# Zwei Aufgaben, mehr nicht:
#   1. /.well-known/acme-challenge/ ausliefern, damit Let's Encrypt das
#      Zertifikat ausstellen und spaeter erneuern kann. Das muss ueber http
#      gehen und ist der Grund, warum Port 80 offen bleibt.
#   2. alles andere mit 301 auf https umleiten.
# ---------------------------------------------------------------------------

<VirtualHost *:80>
        ServerName <site_name>
        <server_alias>

        ServerAdmin <admin_email>

        # Nachweisverzeichnis fuer Let's Encrypt. Liegt bewusst NICHT im
        # DocumentRoot der Site, damit ein Neuausrollen des Inhalts die
        # Nachweise nicht loescht.
        DocumentRoot <acme_webroot>

        <Directory <acme_webroot>>
                Options None
                AllowOverride None
                Require all granted
        </Directory>

        # Alles ausser dem Nachweispfad auf https umleiten.
        <IfModule mod_rewrite.c>
                RewriteEngine On
                RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
                RewriteRule ^/?(.*)$ https://<site_name>/$1 [R=301,L]
        </IfModule>

        ErrorLog ${APACHE_LOG_DIR}/error.log
        LogLevel warn

        CustomLog ${APACHE_LOG_DIR}/access.log combined env=!dont_log
</VirtualHost>
