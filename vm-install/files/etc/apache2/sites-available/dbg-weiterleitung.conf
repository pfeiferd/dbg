# ---------------------------------------------------------------------------
# https (Port 443) fuer die Weiterleitungsdomains (REDIRECT_DOMAINS)
# Abgelegt als /etc/apache2/sites-available/dbg-weiterleitung.conf
#
# Liefert keinen Inhalt, sondern leitet dauerhaft (301) auf die Hauptsite
# weiter - mit eigenem Zertifikat, damit der Browser vor der Weiterleitung
# nicht warnt. Der Pfad bleibt erhalten: https://<redirect_name>/de/x.html
# fuehrt auf https://<site_name>/de/x.html.
#
# Nur eingeschaltet, wenn REDIRECT_DOMAINS gesetzt ist (siehe 70-site.sh).
# ---------------------------------------------------------------------------

<VirtualHost *:443>
        ServerName <redirect_name>
        <redirect_alias>

        ServerAdmin <admin_email>

        Protocols h2 http/1.1

        SSLEngine on
        SSLCertificateFile    <redirect_certificate_file>
        SSLCertificateKeyFile <redirect_certificate_key_file>
        <ssl_stapling>

        # Kein HSTS fuer diese Namen: dbg-hardening.conf setzt es global mit
        # includeSubDomains. Hier wuerde das fuer zwei Jahre ALLE Subdomains
        # dieser Domain auf https festlegen - auch solche, die mit der
        # Website nichts zu tun haben. Fuer eine reine Weiterleitung bringt
        # HSTS ohnehin nichts.
        <IfModule mod_headers.c>
                Header always unset Strict-Transport-Security
        </IfModule>

        RedirectPermanent / https://<site_name>/

        ErrorLog ${APACHE_LOG_DIR}/error.log
        LogLevel warn
        CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined
</VirtualHost>
