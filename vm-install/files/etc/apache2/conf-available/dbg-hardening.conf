# ---------------------------------------------------------------------------
# Grundhaertung des Apache fuer die DBG-Website
# Abgelegt als /etc/apache2/conf-available/dbg-hardening.conf,
# eingeschaltet mit "a2enconf dbg-hardening".
#
# Gilt global, also fuer beide VirtualHosts.
# ---------------------------------------------------------------------------

# Globaler Servername - verhindert ausserdem die Warnung "Could not reliably
# determine the server's fully qualified domain name" beim Start.
ServerName <site_name>
ServerAdmin <admin_email>

# Version und Betriebssystem nicht ausplaudern und keine Server-Signatur
# unter Fehlerseiten setzen.
ServerTokens Prod
ServerSignature Off

# TRACE wird nur fuer Angriffe gebraucht.
TraceEnable Off

# Keine Verzeichnislisten, keine serverseitigen Includes, keine CGI-Skripte -
# die Site besteht ausschliesslich aus statischen Dateien.
<Directory />
        Options None
        AllowOverride None
        Require all denied
</Directory>

# .htaccess-Dateien werden nicht ausgewertet (AllowOverride None im vHost),
# aber auch nicht ausgeliefert. Gleiches gilt fuer alle anderen Dateien, die
# mit einem Punkt beginnen - etwa ein versehentlich mitkopiertes .git oder
# .DS_Store.
<DirectoryMatch "/\.">
        Require all denied
</DirectoryMatch>
<FilesMatch "^\.">
        Require all denied
</FilesMatch>

# Sicherungskopien und Reste, die beim Hochladen mitkommen koennen.
<FilesMatch "(~|\.bak|\.orig|\.save|\.swp|\.tmp|\.log|\.properties|\.md)$">
        Require all denied
</FilesMatch>

# Zeitfenster fuer langsame Angriffe (Slowloris) klein halten.
Timeout 60
KeepAlive On
KeepAliveTimeout 5
MaxKeepAliveRequests 200
RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500

# Hochladen gibt es auf einer statischen Site nicht - 1 MB reicht fuer jede
# legitime Anfrage.
LimitRequestBody 1048576

# --- Antwortkopfzeilen -----------------------------------------------------

<IfModule mod_headers.c>
        # Kein Erraten des Inhaltstyps durch den Browser.
        Header always set X-Content-Type-Options "nosniff"

        # Die Site in keinen fremden Rahmen einbetten lassen.
        Header always set X-Frame-Options "SAMEORIGIN"

        # Beim Verlassen der Site nur die Herkunft, nicht die ganze URL
        # weitergeben - zusammen mit der Datenschutzerklaerung gedacht.
        Header always set Referrer-Policy "strict-origin-when-cross-origin"

        # Kamera, Mikrofon, Standort und Bezahlschnittstellen braucht die
        # Site nicht.
        Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()"

        # Kein Cross-Origin-Zugriff auf unsere Dokumente.
        Header always set Cross-Origin-Opener-Policy "same-origin"

        # HSTS - nur bei einem gueltigen Zertifikat gesetzt, siehe
        # TLS_MODE in config/dbg-vm.conf.
        <hsts_header>
</IfModule>

# --- Komprimierung ---------------------------------------------------------

<IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css
        AddOutputFilterByType DEFLATE application/javascript application/x-javascript
        AddOutputFilterByType DEFLATE application/json application/xml
        AddOutputFilterByType DEFLATE image/svg+xml application/x-font-ttf
</IfModule>

# Wird nur ausgewertet, wenn das Paket libapache2-mod-brotli vorhanden ist;
# 50-apache.sh schaltet es ein, falls es die Distribution mitbringt.
<IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml text/css
        AddOutputFilterByType BROTLI_COMPRESS application/javascript application/json
        AddOutputFilterByType BROTLI_COMPRESS image/svg+xml
</IfModule>

# --- Zwischenspeicherung im Browser ---------------------------------------
#
# Die Dateinamen der generierten Site enthalten keine Versionskennung, eine
# neue Fassung ueberschreibt also den alten Namen. Deshalb bewusst kurze
# Fristen: HTML immer frisch holen, Beiwerk eine Woche behalten.

<IfModule mod_expires.c>
        ExpiresActive On
        ExpiresDefault                          "access plus 1 hour"

        ExpiresByType text/html                 "access plus 0 seconds"

        ExpiresByType text/css                  "access plus 1 day"
        ExpiresByType application/javascript    "access plus 1 day"
        ExpiresByType application/json          "access plus 1 hour"

        ExpiresByType image/png                 "access plus 7 days"
        ExpiresByType image/jpeg                "access plus 7 days"
        ExpiresByType image/gif                 "access plus 7 days"
        ExpiresByType image/svg+xml             "access plus 7 days"
        ExpiresByType image/x-icon              "access plus 7 days"
        ExpiresByType font/woff2                "access plus 30 days"
        ExpiresByType application/pdf           "access plus 7 days"
</IfModule>

<IfModule mod_headers.c>
        # HTML-Seiten duerfen zwischengespeichert, muessen aber vor der
        # Wiederverwendung nachgefragt werden.
        <FilesMatch "\.html$">
                Header set Cache-Control "no-cache, must-revalidate"
        </FilesMatch>
</IfModule>
