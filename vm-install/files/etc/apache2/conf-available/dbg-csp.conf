# ---------------------------------------------------------------------------
# Content Security Policy fuer die DBG-Website
# Abgelegt als /etc/apache2/conf-available/dbg-csp.conf,
# eingeschaltet mit "a2enconf dbg-csp" (siehe ENABLE_CSP in
# config/dbg-vm.conf).
#
# Die generierte Site laedt Skripte (lunr, leaflet, MathJax, highlight.js),
# Stile und Schriften ausnahmslos aus dem eigenen Verzeichnis. Von aussen
# kommen nur die Kartenkacheln der Aerzteliste - deshalb stehen in img-src
# zusaetzlich die Kachelserver.
#
# Diese Liste und die Datenschutzerklaerung muessen zusammenpassen: dort ist
# OpenStreetMap im Abschnitt "Kartenanzeige in der Aerzte- und
# Therapeutenliste" als einziger Dritter benannt, an den eine IP-Adresse geht.
#
# 'unsafe-inline' ist noetig, weil die Seiten eingebettete <script>- und
# <style>-Abschnitte enthalten (z.B. die Sprachweiche in der index.html).
#
# Nach einer Aenderung an den Seitenvorlagen in der Browser-Konsole
# nachsehen, ob Regeln verletzt werden. Zum Ausprobieren ohne Nebenwirkungen
# "Content-Security-Policy" unten durch "Content-Security-Policy-Report-Only"
# ersetzen.
# ---------------------------------------------------------------------------

<IfModule mod_headers.c>
        Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: <csp_img_hosts>; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'"
</IfModule>
