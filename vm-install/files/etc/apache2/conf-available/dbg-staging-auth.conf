# ---------------------------------------------------------------------------
# Anmeldung fuer die Vorschau unter <staging_url_path>/
# Abgelegt als /etc/apache2/conf-available/dbg-staging-auth.conf,
# eingeschaltet mit "a2enconf dbg-staging-auth".
#
# Wird nur erzeugt und eingeschaltet, wenn STAGING_BASIC_AUTH_USERS in
# config/dbg-vm.conf gefuellt ist. Ist die Variable leer, schaltet
# scripts/70-site.sh diese Datei ab und die Vorschau ist offen erreichbar.
#
# Benutzer stehen in /etc/apache2/dbg-staging.htpasswd. Einen weiteren
# hinzufuegen, ohne die Installation erneut laufen zu lassen:
#     sudo htpasswd /etc/apache2/dbg-staging.htpasswd <benutzer>
# Einen entfernen:
#     sudo htpasswd -D /etc/apache2/dbg-staging.htpasswd <benutzer>
# ---------------------------------------------------------------------------

<Location <staging_url_path>>
        AuthType Basic
        AuthName "Vorschau - nicht die oeffentliche Site"
        AuthUserFile /etc/apache2/dbg-staging.htpasswd
        Require valid-user
</Location>
