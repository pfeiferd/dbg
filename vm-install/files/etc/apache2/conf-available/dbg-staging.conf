# ---------------------------------------------------------------------------
# Vorschau des Zweigs "staging" unter <staging_url_path>/
# Abgelegt als /etc/apache2/conf-available/dbg-staging.conf,
# eingeschaltet mit "a2enconf dbg-staging".
#
# Der Inhalt liegt in <staging_doc_root> - also NEBEN dem DocumentRoot der
# oeffentlichen Site, nicht darunter, und wird hier per Alias eingehaengt.
#
# Warum das wichtig ist: beide Auslieferungen gleichen mit "rsync --delete"
# ab. Laege die Vorschau unter dem DocumentRoot, wuerde die naechste
# Auslieferung der oeffentlichen Site sie als "nicht mehr vorhanden" ansehen
# und loeschen. Getrennte Verzeichnisse koennen sich nicht in die Quere kommen.
#
# Der Alias steht global, gilt also fuer beide VirtualHosts. Auf Port 80 ist
# das ohne Wirkung: dort wird alles ausser dem ACME-Pfad auf https umgeleitet.
# ---------------------------------------------------------------------------

Alias <staging_url_path> <staging_doc_root>

<Directory <staging_doc_root>>
        Options -Indexes -Includes -ExecCGI -FollowSymLinks
        AllowOverride None
        Require all granted

        DirectoryIndex index.html
</Directory>

# Die Kopfzeilen bewusst in einem <Location>- und nicht in einem
# <Directory>-Block. Apache fuehrt die Abschnitte in einer festen Reihenfolge
# zusammen: <Directory>, dann <Files>/<FilesMatch>, dann <Location>. In
# dbg-hardening.conf steht ein <FilesMatch "\.html$"> mit einem Cache-Control -
# aus einem <Directory> heraus liesse sich das nicht wieder loswerden, es wuerde
# danach erneut gesetzt. Aus einem <Location> heraus schon.
<Location <staging_url_path>>
        <IfModule mod_headers.c>
                # Suchmaschinen fernhalten. Als Kopfzeile und nicht ueber eine
                # robots.txt: die waere oeffentlich lesbar und wuerde den Pfad
                # der Vorschau gerade verraten. Ausserdem wirkt "noindex" als
                # Kopf auch fuer PDFs und Bilder, ein <meta> im HTML nicht.
                #
                # Zugleich die Antwort auf das Problem mit doppelten Inhalten:
                # Vorschau und oeffentliche Site haben fast denselben Text, und
                # ohne diesen Kopf wuerden sie sich bei der Bewertung
                # gegenseitig im Weg stehen.
                Header always set X-Robots-Tag "noindex, nofollow, noarchive, nosnippet"

                # Die Vorschau soll nie zwischengespeichert werden - sonst
                # sieht man nach einem Checkin noch den alten Stand. Das unset
                # raeumt das Cache-Control aus dbg-hardening.conf weg (siehe
                # oben), "always set" schreibt das eigene.
                Header unset Cache-Control
                Header always set Cache-Control "no-store, no-cache, must-revalidate"
        </IfModule>

        <IfModule mod_expires.c>
                # Hebt die Fristen aus dbg-hardening.conf fuer diesen Pfad auf.
                ExpiresActive Off
        </IfModule>
</Location>
