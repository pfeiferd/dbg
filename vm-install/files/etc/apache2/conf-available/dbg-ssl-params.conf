# ---------------------------------------------------------------------------
# TLS-Einstellungen fuer die DBG-Website
# Abgelegt als /etc/apache2/conf-available/dbg-ssl-params.conf,
# eingeschaltet mit "a2enconf dbg-ssl-params".
#
# Bewusst unabhaengig von der Datei, die certbot anlegt
# (/etc/letsencrypt/options-ssl-apache.conf): so gelten dieselben Werte auch
# im Betrieb mit selbst ausgestelltem Zertifikat, und ein certbot-Update
# aendert die Einstellungen nicht unbemerkt.
#
# Entspricht der "intermediate"-Empfehlung von Mozilla: TLS 1.2 und 1.3,
# ausschliesslich Verfahren mit Vorwaertsgeheimhaltung.
# ---------------------------------------------------------------------------

<IfModule mod_ssl.c>
        SSLProtocol             -all +TLSv1.2 +TLSv1.3

        SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305
        SSLOpenSSLConfCmd       Curves X25519:prime256v1:secp384r1

        # Bei TLS 1.3 waehlt der Client - die Reihenfolge des Servers
        # vorzuschreiben bringt nichts mehr.
        SSLHonorCipherOrder     off

        # Sitzungstickets ohne regelmaessigen Schluesselwechsel schwaechen die
        # Vorwaertsgeheimhaltung.
        SSLSessionTickets       off

        # Komprimierung auf TLS-Ebene (CRIME).
        SSLCompression          off

        SSLSessionCache         shmcb:${APACHE_RUN_DIR}/ssl_scache(512000)
        SSLSessionCacheTimeout  300

        # Zwischenspeicher fuer OCSP-Antworten. Muss global stehen, das
        # Einschalten selbst passiert im VirtualHost.
        SSLStaplingCache        shmcb:${APACHE_RUN_DIR}/ssl_stapling(32768)
        SSLStaplingStandardCacheTimeout 3600
        SSLStaplingErrorCacheTimeout    600
        SSLStaplingReturnResponderErrors off
</IfModule>
