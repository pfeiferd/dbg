# ---------------------------------------------------------------------------
# Haertung des SSH-Daemons fuer die DBG-Website-VM
#
# Liegt als Ergaenzung in /etc/ssh/sshd_config.d/. Die ausgelieferte
# /etc/ssh/sshd_config liest dieses Verzeichnis gleich in ihrer ersten Zeile
# ein ("Include /etc/ssh/sshd_config.d/*.conf"), und beim ersten Vorkommen
# einer Einstellung gewinnt sie - deshalb setzen sich die Werte hier gegen
# die Standardwerte weiter unten in der Hauptdatei durch, ohne dass diese
# angefasst werden muesste.
#
# Erzeugt von vm-install/scripts/20-ssh.sh - nicht von Hand aendern,
# sondern config/dbg-vm.conf anpassen und install.sh erneut laufen lassen.
# ---------------------------------------------------------------------------

Port <ssh_port>

# Anmeldung
PermitRootLogin <ssh_permit_root_login>
PasswordAuthentication <ssh_password_auth>
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
MaxAuthTries 3
MaxSessions 4
LoginGraceTime 30
<ssh_allow_users>

# Nicht benoetigte Funktionen abschalten
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no

# Verbindungen nicht unbegrenzt offen halten
ClientAliveInterval 300
ClientAliveCountMax 2
TCPKeepAlive yes

# Nur aktuelle Verfahren zulassen
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group-exchange-sha256
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com

LogLevel VERBOSE
