# Site-weite Metadaten der Deutschen Borreliose-Gesellschaft e.V.
# Von MetaMerge in jede Seite gemergt -> in den Templates als content.<key>.
# Ein leeres *Url laesst den zugehoerigen Namen als reinen Text stehen.

# Traeger der Site (Logo links oben verlinkt hierher)
universityName=Deutsche Borreliose-Gesellschaft e.V.
universityUrl=https://www.borreliose-gesellschaft.de
universityLogo=dbg-logo.svg

# Text rechts neben dem Logo ("|" markiert den Zeilenumbruch). Links steht nur
# die Bildmarke, der Name gehoert hierher.
facultyName=Deutsche Borreliose-|Gesellschaft e.V.
facultyUrl=

# Bedienelemente der Kopfzeile: fuer eine Website ohne Vorlesungsbetrieb
# entfallen der Pfeil zum Einklappen der Kopfzeile und der Vollbildknopf.
showHeaderToggle=false
showFullscreen=false

# Kein Folienmodus: damit verschwindet auch der Umschalter Dokument/Slides -
# und die Dokumentansicht bleibt verbindlich (auch beim Drucken).
documentOnly=true

# Titel der Registerkarte (nach dem Seitennamen).
siteTitle=Deutsche Borreliose-Gesellschaft e.V.

# Kachelserver der Karten. Ohne Angabe nimmt lecture-gen tile.openstreetmap.org;
# fuer eine deutschsprachige Vereinsseite liegt der Server des deutschen
# OSM-Vereins naeher (deutsche Beschriftungen, Betrieb in Deutschland).
# Die Quellenangabe ist bei OpenStreetMap-Karten Pflicht.
mapTiles=https://tile.openstreetmap.de/{z}/{x}/{y}.png
mapAttribution=&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-Mitwirkende

# Fusszeile: eine Organisation statt der Kette Dozent/Fakultaet/Hochschule.
# Der Wert wird unveraendert ausgegeben - der Schlusspunkt gehoert also hierher
# (hier faellt er mit dem Punkt von "e.V." zusammen).
footerOrg=Deutsche Borreliose-Gesellschaft e.V.
lecturerName=Deutsche Borreliose-Gesellschaft e.V.
lecturerUrl=https://www.borreliose-gesellschaft.de

# Die Site besteht aus einem Inhaltsbereich, der direkt unter content/ liegt
# (de/ ohne Zwischenebene) - deshalb stehen seine Angaben hier site-weit.
navgroup=docs
lecture=dbg
